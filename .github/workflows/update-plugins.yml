name: Update FreeCAD plugins

# SheetMetal and Fasteners are pinned to commits, but upstream releases by
# moving a tag. Check daily and open a PR when a tag points somewhere new.

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-plugins:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Bump plugins
        id: bump
        run: |
          {
            echo "summary<<EOF"
            ./scripts/update-plugins.sh
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-plugins
          delete-branch: true
          commit-message: "chore(plugins): update to latest upstream releases"
          title: "chore(plugins): update to latest upstream releases"
          body: |
            Upstream moved a release tag:

            ${{ steps.bump.outputs.summary }}
